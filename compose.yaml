
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: wealth_tracker
      POSTGRES_USER: wealth_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth_user -d wealth_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
